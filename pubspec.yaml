name: fit_track
description: "A new Flutter project for fitness and nutrition tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.5
  http: ^1.3.0
  mobile_scanner: ^6.0.4
  fl_chart: ^0.70.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/exercises/images/
    - assets/exercises/gifs/
